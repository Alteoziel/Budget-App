# Semgrep rules — Layer C (beyond regex OWASP)
# Custom rules AND registry packs hard-fail on ERROR in CI.

rules:
  - id: budget-app.no-hardcoded-api-keys
    languages: [python]
    severity: ERROR
    message: Hardcoded API key detected. Use environment variables.
    patterns:
      - pattern-either:
          - pattern-regex: (?i)(budget|api)[_-]?key\s*=\s*["']sk-[A-Za-z0-9_\-]{10,}["']
          - pattern-regex: (?i)budget[_-]?api[_-]?key\s*=\s*["'][^"']{12,}["']
          - pattern: BUDGET_API_KEY = "..."
    paths:
      exclude:
        - "**/tests/**"
        - "**/governance/tests/**"

  - id: budget-app.no-shell-true
    languages: [python]
    severity: ERROR
    message: subprocess with shell=True is forbidden in the Budget App.
    pattern: subprocess.$FN(..., shell=True, ...)
    paths:
      include:
        - "**/app/**"

  - id: budget-app.no-os-system
    languages: [python]
    severity: ERROR
    message: os.system is forbidden — use subprocess without shell.
    pattern: os.system(...)
    paths:
      include:
        - "**/app/**"

  - id: budget-app.no-pickle-loads
    languages: [python]
    severity: ERROR
    message: pickle.loads/load is forbidden (RCE risk). Use JSON or typed parsers.
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: pickle.Unpickler(...)
    paths:
      include:
        - "**/app/**"

  - id: budget-app.no-bare-httpx-async-client
    languages: [python]
    severity: ERROR
    message: Use EgressCheckedAsyncClient instead of bare httpx.AsyncClient for outbound calls.
    patterns:
      - pattern: httpx.AsyncClient(...)
      - pattern-not-inside: |
          class EgressCheckedAsyncClient(...):
              ...
    paths:
      include:
        - "**/app/api/**"
        - "**/app/security/**"

  - id: budget-app.no-bare-except-pass
    languages: [python]
    severity: ERROR
    message: Bare except/Exception handlers that only pass are forbidden under app/.
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except:
                  pass
          - pattern: |
              try:
                  ...
              except Exception:
                  pass
          - pattern: |
              try:
                  ...
              except Exception as $E:
                  pass
    paths:
      include:
        - "**/app/**"

  - id: budget-app.v1-routes-require-api-auth
    languages: [python]
    severity: ERROR
    message: |
      /v1 handlers must reference require_api_auth or enforce_rate_limit
      (which depends on require_api_auth) in the function signature.
    patterns:
      - pattern-regex: async def (list_accounts|create_account)\s*\(
      - pattern-not-regex: (?s)async def (?:list_accounts|create_account)\([\s\S]*?(?:require_api_auth|enforce_rate_limit)[\s\S]*?\)(?:\s*->[\s\S]*?)?:\s*\n
    paths:
      include:
        - "**/app/api/**"
