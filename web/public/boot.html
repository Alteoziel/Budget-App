<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Alte' Budgeting</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080c0b !important;
        color-scheme: dark;
      }
    </style>
  </head>
  <body style="background: #080c0b">
    <script>
      (async function () {
        var url = location.href;
        var lockKey = "alte-boot-lock";
        try {
          // Avoid a boot loop if the page cache never warms.
          if (sessionStorage.getItem(lockKey) === url) {
            sessionStorage.removeItem(lockKey);
            location.replace("/offline.html");
            return;
          }
          sessionStorage.setItem(lockKey, url);
          var res = await fetch(url, {
            credentials: "same-origin",
            cache: "reload",
            redirect: "follow",
            headers: {
              Accept: "text/html",
              "X-Alte-Boot": "1",
            },
          });
          if (!res.ok) throw new Error("boot fetch failed");
          // Auth middleware may redirect (e.g. /budget → /login). Follow in the
          // address bar instead of document.writing the wrong URL's HTML.
          if (res.redirected && res.url && res.url !== url) {
            sessionStorage.removeItem(lockKey);
            location.replace(res.url);
            return;
          }
          var html = await res.text();
          sessionStorage.removeItem(lockKey);
          // Replace this document in-place. location.replace() caused a second
          // WKWebView white gap between unloading boot and painting the app.
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          sessionStorage.removeItem(lockKey);
          location.replace("/offline.html");
        }
      })();
    </script>
  </body>
</html>
