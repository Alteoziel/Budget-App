<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3f7a5c" />
    <title>Offline · Alte' Budgeting</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #15241f;
        --sand: #e9e3d6;
        --card: #fefdfa;
        --moss: #3f7a5c;
        --coral: #c45c3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eaf1ed;
          --sand: #0d1211;
          --card: #212926;
          --moss: #5a9a75;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(90,154,117,0.22), transparent 55%),
          var(--sand);
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
      }
      .eyebrow {
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--moss);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.85rem;
        line-height: 1.15;
      }
      p {
        margin: 0.85rem 0 0;
        line-height: 1.45;
        opacity: 0.85;
      }
      .card {
        margin-top: 1.5rem;
        padding: 1rem 1.1rem;
        border-radius: 1.25rem;
        background: var(--card);
        box-shadow: 0 10px 30px rgba(15, 26, 23, 0.08);
      }
      .actions {
        display: grid;
        gap: 0.65rem;
        margin-top: 1.25rem;
      }
      a, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        border-radius: 0.9rem;
        padding: 0.7rem 1rem;
        font-weight: 700;
        text-decoration: none;
        border: 0;
        cursor: pointer;
      }
      .primary {
        background: var(--ink);
        color: var(--sand);
      }
      .secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
      }
      #status {
        margin-top: 1rem;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--coral);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Alte' Budgeting</p>
      <h1>You're offline</h1>
      <p>
        This page loaded from your phone. Open a cached view of your last synced budget,
        or try again when you’re back online.
      </p>
      <div class="card">
        <p style="margin:0">
          Tip: while online, open Budget and Accounts once so your latest numbers are saved
          for airplane mode.
        </p>
      </div>
      <div class="actions">
        <a class="primary" href="/offline">Open cached budget</a>
        <a class="secondary" href="/budget">Retry Budget</a>
        <button class="secondary" type="button" id="reload">Reload</button>
      </div>
      <p id="status"></p>
    </main>
    <script>
      const status = document.getElementById("status");
      function refreshStatus() {
        status.textContent = navigator.onLine
          ? "Connection looks back. Tap Retry Budget."
          : "Still offline.";
        status.style.color = navigator.onLine ? "var(--moss)" : "var(--coral)";
      }
      refreshStatus();
      window.addEventListener("online", refreshStatus);
      window.addEventListener("offline", refreshStatus);
      document.getElementById("reload").addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
