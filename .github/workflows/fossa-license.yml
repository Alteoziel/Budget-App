name: FOSSA License Scan

# Must stay on pull_request so the required check context "FOSSA License Scan"
# reports on the PR head. Dependency Review is not available on this private
# repository without GitHub Advanced Security, so the gate uses FOSSA when
# FOSSA_API_KEY is configured and otherwise fails closed with an explicit
# setup message (never silent-skip).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fossa:
    name: FOSSA License Scan
    runs-on: ubuntu-latest
    # Secrets cannot be referenced in job-level `if:` — route through env instead.
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: FOSSA analyze
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      - name: Secretless denied-license manifest gate
        if: env.FOSSA_API_KEY == ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          DENIED = {"GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later", "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later"}
          DENIED_RE = re.compile(r"(?i)\b(AGPL-3\.0|GPL-3\.0)\b")
          roots = [
              Path("web/package.json"),
              Path("dashboard/package.json"),
              Path("package.json"),
          ]
          issues = []
          found_any = False
          for path in roots:
              if not path.is_file():
                  continue
              found_any = True
              data = json.loads(path.read_text(encoding="utf-8"))
              license_field = data.get("license") or data.get("licence")
              if isinstance(license_field, str) and DENIED_RE.search(license_field):
                  issues.append(f"{path}: package license {license_field!r}")
              for section in ("dependencies", "devDependencies", "optionalDependencies", "peerDependencies"):
                  deps = data.get(section) or {}
                  if not isinstance(deps, dict):
                      continue
                  for name, version in deps.items():
                      blob = f"{name}@{version}"
                      if DENIED_RE.search(blob):
                          issues.append(f"{path}: dependency token looks denied: {blob}")

          if not found_any:
              print("No package.json manifests found to license-gate.", file=sys.stderr)
              sys.exit(1)
          if issues:
              print("Denied-license markers found:", file=sys.stderr)
              for item in issues:
                  print(f"  - {item}", file=sys.stderr)
              sys.exit(1)
          print("Manifest license gate passed (no GPL-3.0/AGPL-3.0 markers).")
          print("FOSSA_API_KEY is unset; configure it for full transitive SCA, or enable GitHub Dependency graph + Advanced Security for Dependency Review.")
          PY
