name: FOSSA License Scan

# Must stay on pull_request so the required check context "FOSSA License Scan"
# reports on the PR head. pull_request_target only runs the workflow from the
# base branch, which still expects the old FOSSA secret path and leaves this
# required check stuck as "Expected — Waiting for status to be reported".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  fossa:
    name: FOSSA License Scan
    runs-on: ubuntu-latest

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: GPL-3.0, AGPL-3.0

      - name: Secretless license gate
        run: echo "Dependency Review supplies the PR vulnerability and license gate without exposing FOSSA credentials to candidate code."
