name: Enterprise Hygiene (Layers B–E)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: enterprise-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  hygiene:
    name: Enterprise Layers B–E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            web/package-lock.json

      # ── Layer B: secrets + dependency audit ─────────────────────────
      - name: "B · Gitleaks secret scan"
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "/tmp/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  /tmp/${ARCHIVE}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "/tmp/${ARCHIVE}" gitleaks
          gitleaks version
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

      - name: "B · pip-audit (governance)"
        working-directory: governance
        run: |
          python -m pip install -U "pip>=25.3" pip-audit
          pip install -e ".[dev]"
          python -m pip_audit --progress-spinner off

      - name: "B · npm audit (dashboard)"
        working-directory: dashboard
        run: |
          npm ci
          npm audit --audit-level=high

      - name: "B · npm audit (web)"
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

      # ── Layer C: lint + SAST ────────────────────────────────────────
      - name: "C · ESLint (web)"
        working-directory: web
        run: npm run lint

      - name: "C · Typecheck (web)"
        working-directory: web
        run: npx tsc --noEmit

      - name: "C · Semgrep"
        run: |
          set -euo pipefail
          IMAGE="semgrep/semgrep:1.110.0"
          docker pull "$IMAGE"
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            semgrep scan \
              --config .semgrep.yml \
              --error \
              --metrics off \
              web governance dashboard
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            semgrep scan \
              --config p/javascript \
              --config p/typescript \
              --config p/owasp-top-ten \
              --severity=ERROR \
              --error \
              --metrics off \
              web dashboard

      # ── Layer D: product tests + builds ─────────────────────────────
      - name: "D · Unit tests (web)"
        working-directory: web
        run: npm test

      - name: "D · Next.js build (web)"
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret
        run: npm run build

      - name: "D · Next.js build (dashboard)"
        working-directory: dashboard
        env:
          SITE_PASSWORD: ci-site-password
          DASHBOARD_INGEST_SECRET: ci-ingest-secret
        run: npm run build

      # ── Layer E: IaC ────────────────────────────────────────────────
      - name: "E · Checkov (Terraform)"
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          output_format: cli
          config_file: infra/terraform/.checkov.yml
