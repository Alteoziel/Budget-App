name: iOS IPA (SideStore)

# Builds an unsigned device IPA on GitHub-hosted macOS. A ~2011 Mac cannot
# install an Xcode that targets iPhone 14/15; this job is the Mac we use instead.
# SideStore (or AltStore Classic) re-signs the IPA with the user's Apple ID.

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
    tags:
      - "ios-v*"
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  ipa:
    name: Unsigned iPhone IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Package unsigned IPA
        working-directory: ios
        env:
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          MARKETING_VERSION: "1.0.0"
        run: bash scripts/package-ipa.sh

      - name: Write SideStore source
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/ios-sideload/AlteBudgeting.ipa
        run: |
          python3 ios/scripts/write-sidestore-source.py \
            --ipa ios/build/AlteBudgeting.ipa \
            --out ios/build/sidestore.json \
            --download-url "${DOWNLOAD_URL}" \
            --version 1.0.0 \
            --build "${{ github.run_number }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AlteBudgeting-unsigned-ipa
          path: |
            ios/build/AlteBudgeting.ipa
            ios/build/sidestore.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish SideStore release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<'EOF'
          Unsigned iPhone build for SideStore (WireGuard) or AltStore Classic.

          SideStore: download AlteBudgeting.ipa, share it into SideStore, or add
          the source https://github.com/Alteoziel/Budget-App/releases/download/ios-sideload/sidestore.json

          This IPA is a WKWebView shell around the live PWA. A 2011-era Mac cannot
          build it; GitHub's macOS runner did.
          EOF
          )"
          if gh release view ios-sideload >/dev/null 2>&1; then
            gh release upload ios-sideload \
              ios/build/AlteBudgeting.ipa \
              ios/build/sidestore.json \
              --clobber
            gh release edit ios-sideload --notes "${NOTES}"
          else
            gh release create ios-sideload \
              ios/build/AlteBudgeting.ipa \
              ios/build/sidestore.json \
              --title "Alte' Budgeting (SideStore IPA)" \
              --prerelease \
              --notes "${NOTES}"
          fi
